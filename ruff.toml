line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "D"]
# D105/D107: magic methods and __init__ are covered by the class docstring.
ignore = ["S101", "D105", "D107"]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
"tests/*" = ["S", "D"]
"migrations/*" = ["D"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]