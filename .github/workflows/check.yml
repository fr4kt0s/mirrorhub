name: check

# Runs the same gates as scripts/check.sh on every push and pull request.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: python -m uv sync --locked

      - name: Compile
        run: .venv/bin/python -m compileall -q src migrations tests

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Format
        run: .venv/bin/python -m ruff format --check .

      - name: Type check
        run: .venv/bin/python -m mypy

      - name: Tests
        run: .venv/bin/python -m pytest

      - name: Build receiver importer
        run: .venv/bin/python scripts/build_importer.py

      - name: Importer image serves the web UI
        run: |
          docker build -f Dockerfile.importer --build-arg MIRRORHUB_COMMIT=abc1234 -t mirrorhub-importer .
          mkdir -p /tmp/ui/in /tmp/ui/st /tmp/ui/out
          printf 'export_dir = "/tmp/ui/in"\nmirror_root = "/tmp/ui/out"\nstate_dir = "/tmp/ui/st"\n' > /tmp/ui/importer.toml
          sudo chown -R 10001:10001 /tmp/ui
          docker run --rm -v /tmp/ui:/tmp/ui mirrorhub-importer --config /tmp/ui/importer.toml --version | grep -F '(abc1234)'
          docker run -d --name importer-ui -p 127.0.0.1:18080:8080 -v /tmp/ui:/tmp/ui \
            -e MIRRORHUB_IMPORTER_CONFIG=/tmp/ui/importer.toml mirrorhub-importer
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://localhost:18080/ | grep -q 'MirrorHub importer'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:18080/)" = 403
          docker logs importer-ui
          docker rm -f importer-ui

      - name: Upload receiver importer
        uses: actions/upload-artifact@v4
        with:
          name: mirrorhub-importer
          path: |
            dist/mirrorhub-importer.pyz
            dist/mirrorhub-importer.pyz.sha256
          if-no-files-found: error

      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e MIRRORHUB_HOSTNAME=mirrorhub.example.lan \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            sh -c 'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile &&
                   caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile |
                   grep -q "mirrorhub.example.lan"'

  stack:
    # Builds the images, starts the full Compose stack and runs the smoke test.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare .env and host directories
        run: |
          mkdir -p /tmp/mirrorhub/data /tmp/mirrorhub/export
          chmod 0777 /tmp/mirrorhub/data /tmp/mirrorhub/export
          cp .env.example .env
          sed -i \
            -e 's|^HOST_DATA_DIR=.*|HOST_DATA_DIR=/tmp/mirrorhub/data|' \
            -e 's|^HOST_EXPORT_DIR=.*|HOST_EXPORT_DIR=/tmp/mirrorhub/export|' \
            -e 's|^MIRRORHUB_ADMIN_PASSWORD=.*|MIRRORHUB_ADMIN_PASSWORD=ci-smoke-password-123|' \
            -e 's|^MIRRORHUB_WORKER_REPLICAS=.*|MIRRORHUB_WORKER_REPLICAS=2|' \
            .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy containers
        run: |
          for _ in $(seq 1 60); do
            states=$(docker inspect -f '{{.Name}} {{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' $(docker compose ps -q))
            echo "$states"
            if ! echo "$states" | grep -v -E ' (healthy|exited)$' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo "containers did not become healthy"
          exit 1

      - name: Import a test key into the managed keyring
        run: |
          docker compose exec -T web python -c "
          from pathlib import Path
          from mirrorhub.services import gpg
          keys = gpg.import_key_file(Path('/usr/share/keyrings/debian-archive-keyring.gpg'))
          print(f'imported {len(keys)} keys')
          assert keys
          "

      - name: Smoke test
        run: MIRRORHUB_URL=https://localhost:8443 sh scripts/smoke_test.sh

      - name: Database is at the latest migration
        run: |
          expected=$(ls migrations/versions | sed -n 's/^\([0-9]\{4\}\)_.*/\1/p' | sort | tail -1)
          actual=$(docker compose exec -T web python -c "import sqlite3; print(sqlite3.connect('/var/lib/mirrorhub/db/mirrorhub.sqlite3').execute('select version_num from alembic_version').fetchone()[0])")
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Images report the commit they were built from
        run: |
          expected="$(git rev-parse --short=12 HEAD)"
          for service in web worker worker-export; do
            actual="$(docker compose exec -T "$service" python -c 'from mirrorhub import buildinfo; print(buildinfo.commit())')"
            echo "$service: $actual (expected $expected)"
            test "$actual" = "$expected"
          done

      - name: Web trusts only the proxy
        run: |
          test "$(docker compose exec -T web printenv FORWARDED_ALLOW_IPS)" = "172.31.254.2"
          docker network inspect mirrorhub_frontend \
            -f '{{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}' | grep -q 'proxy-1=172.31.254.2/'

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down -v
