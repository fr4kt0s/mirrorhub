name: check

# Runs the same gates as scripts/check.sh on every push and pull request.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: python -m uv sync --locked

      - name: Compile
        run: .venv/bin/python -m compileall -q src migrations tests

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Format
        run: .venv/bin/python -m ruff format --check .

      - name: Type check
        run: .venv/bin/python -m mypy

      - name: Tests
        run: .venv/bin/python -m pytest

      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
