<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>{% block title %}MirrorHub{% endblock %} - MirrorHub</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
{% if user %}
  <header class="topbar">
    <a class="brand" href="/">MirrorHub</a>
    <nav>
      {% for label, href in nav %}
        <a href="{{ href }}"{% if request.url.path == href %} class="active"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span class="muted">{{ user.admin.username }}</span>
      <button type="submit" class="btn btn-secondary">Log out</button>
    </form>
  </header>
{% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer muted">MirrorHub {{ version }}</footer>
</body>
</html>
