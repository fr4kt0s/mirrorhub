{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" maxlength="64" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required>
    <button type="submit" class="btn">Log in</button>
  </form>
</section>
{% endblock %}
